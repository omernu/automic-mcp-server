[project]
name = "automic-mcp-server"
version = "0.1.0"
description = "MCP server for Broadcom Automic Automation Engine REST API"
requires-python = ">=3.10"
dependencies = [
    # Pinned to <2: mcp 2.x renamed FastMCP to MCPServer and changed its API.
    # We're building against the FastMCP-based v1 API on purpose.
    "mcp[cli]>=1.2.0,<2",
    # Already pulled in transitively by mcp/pydantic; declared directly
    # because our own code imports them (automic_client.py, config.py,
    # stats.py).
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    # typing_extensions.TypedDict (not typing.TypedDict) is required by
    # pydantic for TypedDict schema generation on Python < 3.12.
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# uv is only needed by `mcp dev` (the MCP Inspector debug tool), which
# shells out to it to run the server in an isolated environment - not a
# runtime dependency of the server itself.
# respx mocks httpx requests/responses, so tests can exercise our Automic
# client code without a real network call to the (currently unreachable) AE
# server.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "uv>=0.4", "respx>=0.21"]

[project.scripts]
automic-mcp-server = "automic_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "auto": async test functions run without needing @pytest.mark.asyncio on
# each one. Simpler for a learning project; a stricter mode exists but adds
# boilerplate we don't need yet.
asyncio_mode = "auto"
